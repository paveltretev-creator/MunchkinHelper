name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Prepare project structure
        run: |
          cp -r backend/app ./app
          cp -r frontend/screens ./screens
          cp -r frontend/controllers ./controllers
          cp -r frontend/services ./services
          cp frontend/main.kv ./main.kv
          
          touch ./app/__init__.py
          touch ./screens/__init__.py
          touch ./controllers/__init__.py
          touch ./services/__init__.py
          
          echo "=== Структура готова ==="
      
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer-cache
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: Build APK with Docker
        run: |
          # --entrypoint sh переопределяет стандартный "buildozer", позволяя выполнить shell-команды
          docker run --rm --entrypoint sh \
            -v $(pwd):/home/user/hostcwd \
            -v ~/.buildozer-cache:/home/user/.buildozer \
            kivy/buildozer -c "yes | sdkmanager --licenses > /dev/null 2>&1 && buildozer android debug"
      
      - name: Find and copy APK
        if: success()
        run: |
          echo "=== Поиск APK ==="
          find . -name "*.apk" -type f
          
          mkdir -p bin
          find . -name "*.apk" -type f -exec cp {} bin/ \;
          
          echo "=== APK в bin/ ==="
          ls -la bin/
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: munchkin-helper-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer-cache/android/platform/build-arm64-v8a/dists/munchkinhelper/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip \
            openjdk-17-jdk-headless \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            ccache python3-pip wget
      
      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH
      
      - name: Install Android SDK
        run: |
          # Скачиваем cmdline-tools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Принимаем ВСЕ лицензии
          yes | sdkmanager --licenses || true
          
          # Устанавливаем нужные компоненты
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"
          sdkmanager "ndk;25.2.9519653"
          
          # ВАЖНО: Копируем в АБСОЛЮТНЫЙ путь, где Buildozer ищет
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools
          cp -r $ANDROID_HOME/build-tools/33.0.2 $HOME/.buildozer/android/platform/android-sdk/build-tools/
          
          # Проверяем
          echo "=== Проверка AIDL ==="
          ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aidl
          
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV
      
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36
      
      - name: Prepare project structure
        run: |
          cp -r backend/app ./app
          cp -r frontend/screens ./screens
          cp -r frontend/controllers ./controllers
          cp -r frontend/services ./services
          cp frontend/main.kv ./main.kv
          
          touch ./app/__init__.py
          touch ./screens/__init__.py
          touch ./controllers/__init__.py
          touch ./services/__init__.py
          
          echo "=== Структура ==="
          ls -la
      
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ./.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-
      
      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      
      - name: Find and copy APK
        if: always()
        run: |
          echo "=== Поиск APK ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "APK не найден"
          
          mkdir -p bin
          find . -name "*.apk" -type f -exec cp {} bin/ \; 2>/dev/null || true
          
          echo "=== APK в bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ пуст"
          
          echo "=== Последние 100 строк build.log ==="
          tail -100 build.log 2>/dev/null || echo "лог не найден"
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: munchkin-helper-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev ccache
      
      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      
      - name: Install buildozer and cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33
      
      - name: Prepare flat project structure
        run: |
          # Buildozer ожидает плоскую структуру — копируем всё в корень
          cp -r backend/app ./app
          cp -r backend/api ./api
          cp -r frontend/screens ./screens
          cp -r frontend/controllers ./controllers
          cp -r frontend/services ./services
          cp frontend/main.kv ./main.kv
          cp frontend/main.py ./main.py
          
          # Создаём __init__.py если их нет
          find ./app ./api ./screens ./controllers ./services -type d -exec touch {}/__init__.py \;
          
          ls -la
      
      - name: Cache buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-
      
      - name: Build debug APK
        run: buildozer android debug
        env:
          ANDROID_HOME: /usr/lib/android-sdk
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: munchkin-helper-debug-apk
          path: bin/*.apk
          retention-days: 30
      
      - name: Upload to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
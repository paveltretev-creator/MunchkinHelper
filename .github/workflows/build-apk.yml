name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Prepare project structure
        run: |
          # Копируем backend
          cp -r backend/app ./app
          
          # Копируем frontend
          cp -r frontend/screens ./screens
          cp -r frontend/controllers ./controllers
          cp -r frontend/services ./services
          cp frontend/main.kv ./main.kv
          
          # Создаём __init__.py
          touch ./app/__init__.py
          touch ./screens/__init__.py
          touch ./controllers/__init__.py
          touch ./services/__init__.py
          
          # Проверяем структуру
          echo "=== Структура ==="
          ls -la
          ls app/
          ls screens/
      
      - name: Build APK with Docker
        run: |
          # Используем официальный образ kivy/buildozer
          docker run --rm -v $(pwd):/home/user/hostcwd kivy/buildozer android debug
        env:
          # Передаём переменные окружения в контейнер
          ANDROID_HOME: /home/user/.buildozer/android/platform/android-sdk
      
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: munchkin-helper-apk
          path: |
            bin/*.apk
            .buildozer/android/bin/*.apk
          retention-days: 30
          if-no-files-found: error
      
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-arm64-v8a/build/libs.txt
            .buildozer/android/platform/build-arm64-v8a/dists/munchkinhelper/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn